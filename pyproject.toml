[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insurance-fairness-diag"
version = "0.1.0"
description = "Proxy discrimination diagnostics for insurance pricing models. Measures L2-distance to admissible price set with Shapley attribution per rating factor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Burning Cost", email = "pricing.frontier@gmail.com" }]
keywords = ["insurance", "fairness", "proxy discrimination", "shapley effects", "actuarial", "pricing", "FCA", "Consumer Duty"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "polars>=1.0.0",
    "scikit-learn>=1.3.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "catboost>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/burning-cost/insurance-fairness-diag"
Repository = "https://github.com/burning-cost/insurance-fairness-diag"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_fairness_diag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
